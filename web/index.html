<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CRM טיסות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== illustration: defined once, drawn with <use> on the login card and the dashboard hero.
       Sized 0x0 rather than display:none, which would stop its gradients from rendering. ===== -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#dbeafe"/>
        <stop offset="1" stop-color="#f0f9ff"/>
      </linearGradient>
      <linearGradient id="plane-body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#dbe4f3"/>
      </linearGradient>
      <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3b82f6"/>
        <stop offset="1" stop-color="#6366f1"/>
      </linearGradient>
    </defs>
    <symbol id="scene" viewBox="0 0 320 200">
      <rect width="320" height="200" rx="22" fill="url(#sky)"/>
      <circle cx="252" cy="52" r="26" fill="#fde68a"/>
      <circle cx="252" cy="52" r="38" fill="#fde68a" opacity=".3"/>

      <g class="cloud cloud-a" fill="#fff">
        <ellipse cx="70" cy="58" rx="30" ry="12"/><ellipse cx="86" cy="50" rx="18" ry="13"/><ellipse cx="60" cy="52" rx="14" ry="10"/>
      </g>
      <g class="cloud cloud-b" fill="#fff" opacity=".9">
        <ellipse cx="230" cy="150" rx="34" ry="12"/><ellipse cx="246" cy="141" rx="18" ry="12"/><ellipse cx="220" cy="144" rx="13" ry="9"/>
      </g>
      <g class="cloud cloud-c" fill="#fff" opacity=".75">
        <ellipse cx="150" cy="34" rx="18" ry="7"/><ellipse cx="158" cy="29" rx="10" ry="7"/>
      </g>

      <!-- hills -->
      <path d="M0 172 C60 150 110 160 160 170 S260 150 320 160 V178 a22 22 0 0 1 -22 22 H22 A22 22 0 0 1 0 178 Z" fill="#bfdbfe"/>
      <path d="M0 184 C70 168 130 178 190 184 S290 172 320 178 V178 a22 22 0 0 1 -22 22 H22 A22 22 0 0 1 0 178 Z" fill="#93c5fd"/>

      <!-- route: departure pin -> dashed arc -> plane -->
      <path d="M52 150 C90 70 160 120 210 88" fill="none" stroke="#6366f1" stroke-width="2.4"
            stroke-dasharray="3 7" stroke-linecap="round" opacity=".7"/>
      <g transform="translate(52 150)">
        <path d="M0 0 C-9 -11 -11 -15 -11 -20 a11 11 0 0 1 22 0 C11 -15 9 -11 0 0 Z" fill="#f43f5e"/>
        <circle cy="-20" r="4.2" fill="#fff"/>
      </g>

      <g class="plane">
        <g transform="translate(222 82) rotate(-18)">
          <path d="M-8 -3 L-26 -30 L-18 -30 L10 -3 Z" fill="url(#wing)" opacity=".8"/>
          <path d="M-34 0 C-34 -6 -28 -8 -21 -8 L22 -8 C32 -8 40 -4 42 0 C40 4 33 5 22 5 L-21 5 C-29 5 -34 4 -34 0 Z"
                fill="url(#plane-body)" stroke="#c7d2fe" stroke-width="1"/>
          <path d="M-24 -6 L-34 -24 L-27 -24 L-13 -6 Z" fill="url(#wing)"/>
          <path d="M-4 0 L-20 24 L-11 24 L14 0 Z" fill="url(#wing)"/>
          <path d="M31 -6 C36 -5 39 -3 40 -1 L31 -1 Z" fill="#1e3a8a"/>
          <g fill="#93c5fd">
            <circle cx="-14" cy="-2.5" r="1.6"/><circle cx="-8" cy="-2.5" r="1.6"/><circle cx="-2" cy="-2.5" r="1.6"/>
            <circle cx="4" cy="-2.5" r="1.6"/><circle cx="10" cy="-2.5" r="1.6"/><circle cx="16" cy="-2.5" r="1.6"/><circle cx="22" cy="-2.5" r="1.6"/>
          </g>
        </g>
      </g>
    </symbol>
  </svg>

  <!-- ===== login ===== -->
  <div class="gate" id="gate" hidden>
    <form class="card" id="login-form">
      <svg class="card-art" role="img" aria-label="מטוס בשמיים"><use href="#scene"/></svg>
      <div class="brand">
        <span class="brand-mark">✈</span>
        <div>
          <h2>CRM טיסות</h2>
          <p class="card-sub">מערכת ניהול הזמנות</p>
        </div>
      </div>

      <label for="email">אימייל</label>
      <input type="email" id="email" required autocomplete="username" dir="ltr">

      <label for="password">סיסמה</label>
      <input type="password" id="password" required autocomplete="current-password" dir="ltr">

      <p class="form-msg" id="login-msg" hidden></p>
      <button type="submit" class="btn" id="login-btn">כניסה למערכת</button>
    </form>
  </div>

  <!-- ===== app ===== -->
  <div id="app" hidden>

    <header class="topbar">
      <div class="wrap">
        <div class="brand brand-sm">
          <span class="brand-mark">✈</span>
          <h1>CRM טיסות</h1>
        </div>
        <div class="topbar-end">
          <span class="role-tag" id="role-tag"></span>
          <span class="user" id="user-email"></span>
          <button class="btn-link" id="logout-btn">יציאה</button>
        </div>
      </div>
    </header>

    <main class="wrap">

      <section class="hero">
        <div class="hero-text">
          <p class="hero-kicker">ברוכים הבאים</p>
          <h2>לאן טסים היום?</h2>
          <p>כל הטיסות, ההזמנות והלקוחות — במקום אחד.</p>
        </div>
        <svg class="hero-art" aria-hidden="true"><use href="#scene"/></svg>
      </section>

      <!-- ===== the digital board: centrepiece ===== -->
      <section class="board">
        <div class="board-bar">
          <div class="board-id">
            <span class="live-dot"></span>
            <h2 id="board-title">לוח טיסות</h2>
          </div>
          <time class="board-clock" id="board-clock">--:--:--</time>
        </div>

        <div class="board-head">
          <span>טיסה</span>
          <span>מוצא</span>
          <span>יעד</span>
          <span>המראה</span>
          <span id="board-col5">סטטוס</span>
        </div>

        <div class="board-rows" id="board-rows"></div>
        <p class="board-empty" id="board-empty" hidden>אין טיסות להצגה</p>
      </section>

      <section class="stats" id="stats" hidden>
        <div class="stat s-cyan">
          <span class="stat-label">לקוחות</span>
          <span class="stat-num" id="stat-customers">—</span>
        </div>
        <div class="stat s-violet">
          <span class="stat-label">טיסות</span>
          <span class="stat-num" id="stat-flights">—</span>
        </div>
        <div class="stat s-amber">
          <span class="stat-label">הזמנות</span>
          <span class="stat-num" id="stat-bookings">—</span>
        </div>
        <div class="stat s-emerald">
          <span class="stat-label">מאושרות</span>
          <span class="stat-num" id="stat-confirmed">—</span>
        </div>
      </section>

      <!-- customer document card -->
      <section id="customer-panel" hidden>
        <section class="doc-card">
          <div class="doc-head">
            <div>
              <h3>דרכון</h3>
              <p class="doc-status" id="passport-status">בודק…</p>
            </div>
            <a class="btn-link" id="passport-view" hidden target="_blank" rel="noopener">צפייה</a>
          </div>
          <input type="file" id="passport-file" accept="image/jpeg,image/png,application/pdf">
          <button class="btn btn-sm" id="passport-upload" disabled>העלאה</button>
          <p class="doc-note">JPG, PNG או PDF · עד 5MB · נגיש לך ולצוות בלבד</p>
          <p class="form-msg" id="passport-msg" hidden></p>
        </section>
      </section>

      <!-- admin tables -->
      <section id="admin-panel" hidden>
        <nav class="tabs" role="tablist">
          <button class="tab is-active" data-view="customers" role="tab">לקוחות</button>
          <button class="tab" data-view="flights"   role="tab">טיסות</button>
          <button class="tab" data-view="bookings"  role="tab">הזמנות</button>
          <button class="tab" data-view="passports" role="tab">דרכונים</button>
        </nav>

        <div class="toolbar">
          <input type="search" id="search" placeholder="חיפוש…" autocomplete="off">
          <span class="count" id="count"></span>
        </div>
      </section>

      <div id="alert" class="alert" hidden></div>

      <div class="table-scroll" id="table-wrap" hidden>
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <p class="empty" id="empty" hidden></p>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
