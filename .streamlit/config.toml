# Streamlit theme for ZivAirline CRM.
# The colours match zivair/ui/theme.py - the charts are validated against this
# light surface, so the app is pinned to the light theme on purpose.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"

[server]
headless = true

[browser]
gatherUsageStats = false
